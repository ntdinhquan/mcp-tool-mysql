[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpm-server"
version = "0.1.0"
description = "MCP server exposing MySQL data to external parties through per-table scoped tokens"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "cryptography>=42",  # MySQL 8 caching_sha2_password over a non-TLS connection
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cpm_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
